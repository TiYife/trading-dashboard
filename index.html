<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f0f0f; color: #eee; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body class="p-6 min-h-screen flex flex-col items-center">
    <div class="w-full max-w-7xl mb-8 text-center">
        <h1 class="text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-purple-500 to-emerald-400 mb-2">
            交易指挥中心
        </h1>
        <p class="text-gray-500 text-sm">Trading Dashboard Command Center</p>
    </div>

    <a href="system.html" class="w-full max-w-7xl mb-6 glass rounded-2xl p-8 border border-white/10 shadow-2xl block hover:bg-white/5 transition-all group relative overflow-hidden">
        <div class="absolute top-0 right-0 w-64 h-64 bg-amber-500/10 rounded-full blur-3xl -mr-32 -mt-32 pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl -ml-32 -mb-32 pointer-events-none"></div>

        <div class="relative z-10 flex flex-col items-center">
            <h2 class="text-3xl font-bold text-center mb-4 bg-clip-text text-transparent bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-600 group-hover:scale-105 transition-transform duration-300">
                🌍 全球宏观价值投资体系（终极完整版）
            </h2>

            <div class="text-xl md:text-2xl font-mono text-blue-300 mb-6 font-bold text-center">
                利润 = 信用扩张 <span class="text-yellow-400">×</span> (低估资产 + 催化剂) <span class="text-yellow-400">×</span> 趋势共振
            </div>

            <div class="flex items-center gap-2 text-gray-400 text-sm border border-white/10 px-4 py-2 rounded-full bg-black/20 group-hover:bg-black/40 group-hover:text-white transition-colors">
                <span>点击查看完整体系详情</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </div>
        </div>
    </a>

    <a href="研究框架/霍尔木兹海峡通航-大类资产情景看板.html" class="w-full max-w-7xl mb-12 glass rounded-2xl p-6 border border-white/10 shadow-2xl block hover:bg-white/5 transition-all group relative overflow-hidden">
        <div class="absolute top-0 left-1/2 w-72 h-72 bg-red-500/10 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
        <div class="absolute bottom-0 right-0 w-72 h-72 bg-cyan-500/10 rounded-full blur-3xl translate-x-1/3 translate-y-1/3 pointer-events-none"></div>

        <div class="relative z-10 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
            <div class="max-w-4xl">
                <div class="text-[11px] uppercase tracking-[0.2em] text-amber-300/80 font-bold mb-2">专题看板</div>
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-3 leading-tight">
                    霍尔木兹海峡通航恢复 × 全球大类资产情景看板
                </h2>
                <p class="text-sm md:text-base text-gray-400 leading-relaxed">
                    把“物理通行 / 商业承运 / 终端供给”三层恢复链条压成情景卡 + 热力矩阵 + 黄金白银拆分速查表。
                </p>
            </div>

            <div class="flex flex-wrap gap-2 text-xs text-gray-300">
                <span class="px-3 py-1 rounded-full border border-emerald-500/20 bg-emerald-500/10">A 全面缓解</span>
                <span class="px-3 py-1 rounded-full border border-amber-500/20 bg-amber-500/10">B 伪缓和</span>
                <span class="px-3 py-1 rounded-full border border-red-500/20 bg-red-500/10">C 冲击升级</span>
                <span class="px-3 py-1 rounded-full border border-blue-500/20 bg-blue-500/10">D 中度再通胀</span>
            </div>
        </div>
    </a>

    <div class="w-full max-w-7xl grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
        <div class="flex flex-col gap-4">
            <div class="flex items-center justify-between px-2 border-b border-purple-900/30 pb-2">
                <h2 class="text-lg font-bold text-purple-400 flex items-center gap-2">
                    <span class="w-8 h-8 rounded-lg bg-purple-900/30 flex items-center justify-center text-sm">🎯</span>
                    交易计划
                </h2>
                <span id="count-plan" class="text-xs text-gray-600 font-mono">0</span>
            </div>
            <div id="list-plan" class="space-y-3 min-h-[100px]">
                <div class="text-center py-8 text-gray-600 text-sm animate-pulse">正在扫描...</div>
            </div>
        </div>

        <div class="flex flex-col gap-4">
            <div class="flex items-center justify-between px-2 border-b border-amber-900/30 pb-2">
                <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2">
                    <span class="w-8 h-8 rounded-lg bg-amber-900/30 flex items-center justify-center text-sm">📉</span>
                    复盘
                </h2>
                <span id="count-review" class="text-xs text-gray-600 font-mono">0</span>
            </div>
            <div id="list-review" class="space-y-3 min-h-[100px]">
                <div class="text-center py-8 text-gray-600 text-sm animate-pulse">正在扫描...</div>
            </div>
        </div>

        <div class="flex flex-col gap-4">
            <div class="flex items-center justify-between px-2 border-b border-emerald-900/30 pb-2">
                <h2 class="text-lg font-bold text-emerald-400 flex items-center gap-2">
                    <span class="w-8 h-8 rounded-lg bg-emerald-900/30 flex items-center justify-center text-sm">🧘</span>
                    心法
                </h2>
                <span id="count-mind" class="text-xs text-gray-600 font-mono">0</span>
            </div>
            <div id="list-mind" class="space-y-3 min-h-[100px]">
                <div class="text-center py-8 text-gray-600 text-sm animate-pulse">正在扫描...</div>
            </div>
        </div>

        <div class="flex flex-col gap-4">
            <div class="flex items-center justify-between px-2 border-b border-blue-900/30 pb-2">
                <h2 class="text-lg font-bold text-blue-400 flex items-center gap-2">
                    <span class="w-8 h-8 rounded-lg bg-blue-900/30 flex items-center justify-center text-sm">🗺️</span>
                    研究框架
                </h2>
                <span id="count-framework" class="text-xs text-gray-600 font-mono">0</span>
            </div>
            <div id="list-framework" class="space-y-3 min-h-[100px]">
                <div class="text-center py-8 text-gray-600 text-sm animate-pulse">正在扫描...</div>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_USERNAME = 'tiyife';
        const REPO_NAME = 'trading-dashboard';

        const CATEGORIES = {
            plan: {
                id: 'list-plan',
                countId: 'count-plan',
                dir: '交易计划',
                icon: '📝',
                color: 'purple'
            },
            review: {
                id: 'list-review',
                countId: 'count-review',
                dir: '复盘',
                icon: '📉',
                color: 'gold'
            },
            mind: {
                id: 'list-mind',
                countId: 'count-mind',
                dir: '心法',
                icon: '🧠',
                color: 'emerald'
            },
            framework: {
                id: 'list-framework',
                countId: 'count-framework',
                dir: '研究框架',
                icon: '🗺️',
                color: 'blue'
            }
        };

        async function fetchDirFiles(catKey) {
            const cat = CATEGORIES[catKey];
            const container = document.getElementById(cat.id);
            const countEl = document.getElementById(cat.countId);
            const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${encodeURIComponent(cat.dir)}?ref=main&t=${Date.now()}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    if (response.status === 404) {
                        container.innerHTML = '<div class="text-center py-8 text-gray-600 text-xs italic border border-dashed border-gray-800 rounded-xl">目录不存在</div>';
                        return 0;
                    }
                    throw new Error('API Error');
                }

                const data = await response.json();
                let htmlFiles = data.filter(file => file.name.endsWith('.html'));

                htmlFiles = htmlFiles.filter(file => {
                    const lowerName = file.name.toLowerCase();
                    return !lowerName.includes('template') && !lowerName.includes('test');
                });

                htmlFiles.sort((a, b) => {
                    const dateA = (a.name.match(/^(\d{8})/) || [''])[0];
                    const dateB = (b.name.match(/^(\d{8})/) || [''])[0];

                    if (dateA && dateB) {
                        return dateB.localeCompare(dateA);
                    } else if (dateA) {
                        return -1;
                    } else if (dateB) {
                        return 1;
                    } else {
                        return a.name.localeCompare(b.name);
                    }
                });

                container.innerHTML = '';

                if (htmlFiles.length === 0) {
                    container.innerHTML = '<div class="text-center py-8 text-gray-600 text-xs italic border border-dashed border-gray-800 rounded-xl">暂无文件</div>';
                    return 0;
                }

                htmlFiles.forEach(file => {
                    const displayName = file.name.replace('.html', '').toUpperCase();
                    const card = document.createElement('a');
                    card.href = file.path;
                    card.className = 'glass block p-4 rounded-xl transition-all duration-300 flex justify-between items-center group hover:translate-x-1';

                    const iconBg = {
                        blue: 'bg-blue-900/30 text-blue-400',
                        purple: 'bg-purple-900/30 text-purple-400',
                        emerald: 'bg-emerald-900/30 text-emerald-400',
                        gold: 'bg-amber-900/30 text-amber-400'
                    }[cat.color];

                    card.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg ${iconBg} flex items-center justify-center text-lg">
                                ${cat.icon}
                            </div>
                            <div>
                                <div class="font-bold text-gray-200 group-hover:text-white transition-colors">${displayName}</div>
                                <div class="text-[10px] text-gray-500 uppercase tracking-widest">${cat.dir}</div>
                            </div>
                        </div>
                        <div class="text-gray-700 group-hover:text-white transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                        </div>
                    `;
                    container.appendChild(card);
                });

                countEl.textContent = htmlFiles.length;
                return htmlFiles.length;

            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="p-4 border border-red-900/30 bg-red-900/10 rounded-xl text-red-400/70 text-[10px] text-center">ERR: ${cat.dir} 加载失败</div>`;
                return 0;
            }
        }

        async function fetchAll() {
            await Promise.all([
                fetchDirFiles('plan'),
                fetchDirFiles('review'),
                fetchDirFiles('mind'),
                fetchDirFiles('framework')
            ]);
        }

        fetchAll();
    </script>
</body>
</html>
