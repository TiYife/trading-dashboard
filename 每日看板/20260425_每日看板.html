                </div>
                <div class="glass rounded-3xl p-6 shadow-2xl">
                    <h2 class="text-lg font-bold text-white">风险与观察</h2>
                    <div class="mt-4 space-y-5">
                        <div>
                            <div class="mb-2 text-xs uppercase tracking-[0.16em] text-rose-300">风险提示</div>
                            <ul id="risks" class="space-y-3 text-sm leading-7 text-slate-200"></ul>
                        </div>
                        <div>
                            <div class="mb-2 text-xs uppercase tracking-[0.16em] text-amber-300">观察点</div>

                <div class="glass rounded-3xl p-6 shadow-2xl">

                            <div class="mb-2 text-xs uppercase tracking-[0.16em] text-cyan-300">数据源</div>
                            <div id="sources" class="flex flex-wrap gap-2"></div>
                        </div>
                        <div>
                            <div class="mb-2 text-xs uppercase tracking-[0.16em] text-slate-400">限制说明</div>
                            <ul id="limitations" class="space-y-3 text-sm leading-7 text-slate-200"></ul>
                        </div>
                        <div>

                            <ul id="signals" class="space-y-3 text-sm leading-7 text-slate-200"></ul>
                        </div>
                    </div>
                </div>
                <div id="missing-panel" class="glass hidden rounded-3xl p-6 shadow-2xl">
                    <h2 class="text-lg font-bold text-white">缺失项</h2>
                    <div class="mt-4 space-y-4">
                        <div>

                </div>
            </div>
        </section>

        const $ = (id) => document.getElementById(id);

        function appendList(targetId, items, emptyText) {
            const target = $(targetId);
            target.innerHTML = '';
            if (!Array.isArray(items) || items.length === 0) {
                const li = document.createElement('li');
                li.className = 'text-sm text-slate-500 italic';
                li.textContent = emptyText;
                target.appendChild(li);
                return;
            }
            items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'rounded-2xl border border-white/5 bg-white/5 px-4 py-3';
                li.textContent = item;
                target.appendChild(li);
            });
        }

        function appendChips(targetId, items, emptyText) {
            const target = $(targetId);
            target.innerHTML = '';
            if (!Array.isArray(items) || items.length === 0) {
                const span = document.createElement('span');
                span.className = 'chip rounded-full px-3 py-1 text-xs text-slate-500';
                span.textContent = emptyText;
                target.appendChild(span);
                return;
            }
            items.forEach(item => {
                const span = document.createElement('span');
                span.className = 'chip rounded-full px-3 py-1 text-xs text-slate-200';
                span.textContent = item;
                target.appendChild(span);
            });
        }

        function renderSections(sections) {
            const container = $('sections-list');
            container.innerHTML = '';
            (Array.isArray(sections) ? sections : []).forEach(section => {
                const card = document.createElement('article');
                card.className = 'glass rounded-3xl p-6 shadow-2xl';
                card.innerHTML = `
                    <div class="mb-4 flex items-center justify-between gap-4">
                        <h2 class="text-xl font-bold text-white">${section.title || '未命名模块'}</h2>
                        <span class="chip rounded-full px-3 py-1 text-[11px] uppercase tracking-[0.16em] text-slate-300">模块</span>
                    </div>
                    <div class="whitespace-pre-wrap leading-8 text-slate-200">${section.content || '本模块缺失'}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderBanner(meta) {
            const banner = $('status-banner');
            const status = meta.publish_status || 'ok';
            const warnings = Array.isArray(meta.warnings) ? meta.warnings : [];
            const missingModules = Array.isArray(meta.missing_modules) ? meta.missing_modules : [];
            const lines = [];
            if (meta.operator_notice) lines.push(meta.operator_notice);
            if (warnings.length) lines.push(`警告：${warnings.join('；')}`);
            if (missingModules.length) lines.push(`缺失模块：${missingModules.join(' / ')}`);
            if (lines.length === 0 && status === 'ok') return;
            banner.classList.remove('hidden');
            banner.className = 'rounded-2xl border px-5 py-4 text-sm shadow-xl ' + (
                status === 'ok'
                    ? 'border-emerald-500/30 bg-emerald-500/10 text-emerald-100'
                    : 'border-amber-500/30 bg-amber-500/10 text-amber-100'
            );
            banner.innerHTML = `<div class="font-semibold">${status === 'ok' ? '正常发布' : '降级发布'}</div><div class="mt-2 leading-7">${lines.join('<br>')}</div>`;
        }

        function renderMissing(meta, dashboard) {
            const hasMissing = (meta.missing_modules && meta.missing_modules.length) || (dashboard.missing_items && dashboard.missing_items.length);
            if (!hasMissing) return;
            $('missing-panel').classList.remove('hidden');
            appendChips('missing-modules', meta.missing_modules || [], '暂无');
            const list = $('missing-items');
            list.innerHTML = '';
            (dashboard.missing_items || []).forEach(item => {
                const li = document.createElement('li');
                li.className = 'rounded-2xl border border-white/5 bg-white/5 px-4 py-3';
                li.textContent = item.reason ? `${item.label}: ${item.reason}` : item.label;
                list.appendChild(li);
            });
            if (!dashboard.missing_items || dashboard.missing_items.length === 0) {
                const li = document.createElement('li');
                li.className = 'text-sm text-slate-500 italic';
                li.textContent = '暂无缺失明细';
                list.appendChild(li);
            }
        }

        function render() {
            const meta = DASHBOARD_DATA.meta || {};
            const dashboard = DASHBOARD_DATA.dashboard || {};

            $('page-title').textContent = dashboard.title || '每日市场看板';
            $('page-subtitle').textContent = dashboard.subtitle || '';
            $('meta-run-date').textContent = meta.run_date || '-';
            $('meta-generated-at').textContent = meta.generated_at || '-';
            $('market-regime').textContent = dashboard.market_regime || 'mixed';
            $('market-summary').textContent = dashboard.summary || '暂无摘要';

            renderBanner(meta);
            renderSections(dashboard.sections || []);
            appendList('key-points', dashboard.key_points || [], '暂无关键驱动');
            appendList('risks', dashboard.risks || [], '暂无风险提示');
            appendList('watch-items', dashboard.watch_items || [], '暂无观察点');
            appendList('limitations', dashboard.limitations || [], '暂无限制说明');
            appendList('signals', dashboard.signals || [], '暂无异常信号');
            appendChips('sources', dashboard.sources || [], '暂无数据源');
            renderMissing(meta, dashboard);
        }

        render();
    </script>
</body>
</html>
