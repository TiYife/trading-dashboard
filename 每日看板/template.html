<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at top, #111827 0%, #020617 55%, #000 100%); color: #e5eefb; }
        .glass { background: rgba(15, 23, 42, 0.72); border: 1px solid rgba(148, 163, 184, 0.14); backdrop-filter: blur(12px); }
        .chip { border: 1px solid rgba(148, 163, 184, 0.2); background: rgba(15, 23, 42, 0.55); }
    </style>
</head>
<body class="min-h-screen px-4 py-8 md:px-8">
    <div class="mx-auto flex max-w-7xl flex-col gap-6">
        <header class="glass rounded-3xl p-6 shadow-2xl">
            <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
                <div>
                    <div class="mb-3 inline-flex items-center rounded-full border border-cyan-500/20 bg-cyan-500/10 px-3 py-1 text-xs text-cyan-200">
                        每日看板 / Daily Dashboard
                    </div>
                    <h1 id="page-title" class="text-3xl font-black tracking-tight text-white md:text-4xl"></h1>
                    <p id="page-subtitle" class="mt-3 max-w-3xl text-sm leading-7 text-slate-300 md:text-base"></p>
                </div>
                <div class="grid grid-cols-1 gap-3 text-sm text-slate-300 md:grid-cols-2">
                    <div class="glass rounded-2xl px-4 py-3">
                        <div class="text-[11px] uppercase tracking-[0.18em] text-slate-500">运行日期</div>
                        <div id="meta-run-date" class="mt-2 font-mono text-slate-100"></div>
                    </div>
                    <div class="glass rounded-2xl px-4 py-3">
                        <div class="text-[11px] uppercase tracking-[0.18em] text-slate-500">生成时间</div>
                        <div id="meta-generated-at" class="mt-2 font-mono text-slate-100"></div>
                    </div>
                </div>
            </div>
        </header>

        <section id="status-banner" class="hidden rounded-2xl border px-5 py-4 text-sm shadow-xl"></section>

        <section class="grid grid-cols-1 gap-6 xl:grid-cols-[1.3fr_0.9fr]">
            <div class="flex flex-col gap-6">
                <div class="glass rounded-3xl p-6 shadow-2xl">
                    <div class="mb-4 flex items-center justify-between">
                        <h2 class="text-xl font-bold text-white">市场总览</h2>
                        <span id="market-regime" class="chip rounded-full px-3 py-1 text-xs text-slate-200"></span>
                    </div>
                    <p id="market-summary" class="leading-8 text-slate-200"></p>
                </div>
                <div id="module-overview-panel" class="glass hidden rounded-3xl p-6 shadow-2xl">
                    <div class="mb-5 flex items-center justify-between gap-4">
                        <div>
                            <h2 class="text-xl font-bold text-white">模块摘要卡</h2>
                            <p class="mt-1 text-sm text-slate-400">先看结构化脉络，再往下读完整分析。</p>
                        </div>
                        <span class="chip rounded-full px-3 py-1 text-xs text-slate-200">Overview Cards</span>
                    </div>
                    <div id="module-cards" class="grid grid-cols-1 gap-4 md:grid-cols-2"></div>
                </div>
                <div id="sections-list" class="grid grid-cols-1 gap-6"></div>
            </div>

            <div class="flex flex-col gap-6">
                <div class="glass rounded-3xl p-6 shadow-2xl">
                    <h2 class="text-lg font-bold text-white">关键驱动</h2>
                    <ul id="key-points" class="mt-4 space-y-3 text-sm leading-7 text-slate-200"></ul>
                </div>
                <div class="glass rounded-3xl p-6 shadow-2xl">
                    <h2 class="text-lg font-bold text-white">风险与观察</h2>
                    <div class="mt-4 space-y-5">
                        <div>
                            <div class="mb-2 text-xs uppercase tracking-[0.16em] text-rose-300">风险提示</div>
                            <ul id="risks" class="space-y-3 text-sm leading-7 text-slate-200"></ul>
                        </div>
                        <div>
                            <div class="mb-2 text-xs uppercase tracking-[0.16em] text-amber-300">观察点</div>
                            <ul id="watch-items" class="space-y-3 text-sm leading-7 text-slate-200"></ul>
                        </div>
                    </div>
                </div>
                <div class="glass rounded-3xl p-6 shadow-2xl">
                    <h2 class="text-lg font-bold text-white">数据口径</h2>
                    <div class="mt-4 space-y-4">
                        <div>
                            <div class="mb-2 text-xs uppercase tracking-[0.16em] text-cyan-300">数据源</div>
                            <div id="sources" class="flex flex-wrap gap-2"></div>
                        </div>
                        <div>
                            <div class="mb-2 text-xs uppercase tracking-[0.16em] text-slate-400">限制说明</div>
                            <ul id="limitations" class="space-y-3 text-sm leading-7 text-slate-200"></ul>
                        </div>
                        <div>
                            <div class="mb-2 text-xs uppercase tracking-[0.16em] text-fuchsia-300">异常信号</div>
                            <ul id="signals" class="space-y-3 text-sm leading-7 text-slate-200"></ul>
                        </div>
                    </div>
                </div>
                <div id="missing-panel" class="glass hidden rounded-3xl p-6 shadow-2xl">
                    <h2 class="text-lg font-bold text-white">缺失项</h2>
                    <div class="mt-4 space-y-4">
                        <div>
                            <div class="mb-2 text-xs uppercase tracking-[0.16em] text-orange-300">缺失模块</div>
                            <div id="missing-modules" class="flex flex-wrap gap-2"></div>
                        </div>
                        <div>
                            <div class="mb-2 text-xs uppercase tracking-[0.16em] text-orange-300">缺失明细</div>
                            <ul id="missing-items" class="space-y-3 text-sm leading-7 text-slate-200"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const DASHBOARD_DATA = __DASHBOARD_DATA_JSON__;

        const $ = (id) => document.getElementById(id);

        function appendList(targetId, items, emptyText) {
            const target = $(targetId);
            target.innerHTML = '';
            if (!Array.isArray(items) || items.length === 0) {
                const li = document.createElement('li');
                li.className = 'text-sm text-slate-500 italic';
                li.textContent = emptyText;
                target.appendChild(li);
                return;
            }
            items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'rounded-2xl border border-white/5 bg-white/5 px-4 py-3';
                li.textContent = item;
                target.appendChild(li);
            });
        }

        function appendChips(targetId, items, emptyText) {
            const target = $(targetId);
            target.innerHTML = '';
            if (!Array.isArray(items) || items.length === 0) {
                const span = document.createElement('span');
                span.className = 'chip rounded-full px-3 py-1 text-xs text-slate-500';
                span.textContent = emptyText;
                target.appendChild(span);
                return;
            }
            items.forEach(item => {
                const span = document.createElement('span');
                span.className = 'chip rounded-full px-3 py-1 text-xs text-slate-200';
                span.textContent = item;
                target.appendChild(span);
            });
        }

        function renderSections(sections) {
            const container = $('sections-list');
            container.innerHTML = '';
            (Array.isArray(sections) ? sections : []).forEach(section => {
                const card = document.createElement('article');
                card.className = 'glass rounded-3xl p-6 shadow-2xl';
                card.id = `section-${section.id || 'unknown'}`;
                card.innerHTML = `
                    <div class="mb-4 flex items-center justify-between gap-4">
                        <h2 class="text-xl font-bold text-white">${section.title || '未命名模块'}</h2>
                        <span class="chip rounded-full px-3 py-1 text-[11px] uppercase tracking-[0.16em] text-slate-300">模块</span>
                    </div>
                    <div class="whitespace-pre-wrap leading-8 text-slate-200">${section.content || '本模块缺失'}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderModuleCards(cards) {
            const panel = $('module-overview-panel');
            const container = $('module-cards');
            container.innerHTML = '';
            if (!Array.isArray(cards) || cards.length === 0) {
                panel.classList.add('hidden');
                return;
            }
            panel.classList.remove('hidden');
            const accentStyles = [
                'from-cyan-500/20 to-sky-500/10 border-cyan-500/20',
                'from-violet-500/20 to-fuchsia-500/10 border-violet-500/20',
                'from-amber-500/20 to-orange-500/10 border-amber-500/20',
                'from-emerald-500/20 to-teal-500/10 border-emerald-500/20'
            ];
            cards.forEach((card, index) => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = `rounded-3xl border bg-gradient-to-br p-5 text-left transition hover:-translate-y-0.5 hover:shadow-2xl ${accentStyles[index % accentStyles.length]}`;
                item.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <h3 class="text-base font-bold text-white">${card.title || '未命名模块'}</h3>
                        <span class="chip rounded-full px-3 py-1 text-[11px] text-slate-200">详情</span>
                    </div>
                    <p class="mt-3 text-sm leading-7 text-slate-200">${card.summary || '暂无摘要'}</p>
                `;
                item.addEventListener('click', () => {
                    const target = document.getElementById(`section-${card.id}`);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
                container.appendChild(item);
            });
        }

        function renderBanner(meta) {
            const banner = $('status-banner');
            const status = meta.publish_status || 'ok';
            const warnings = Array.isArray(meta.warnings) ? meta.warnings : [];
            const missingModules = Array.isArray(meta.missing_modules) ? meta.missing_modules : [];
            const lines = [];
            if (meta.operator_notice) lines.push(meta.operator_notice);
            if (warnings.length) lines.push(`警告：${warnings.join('；')}`);
            if (missingModules.length) lines.push(`缺失模块：${missingModules.join(' / ')}`);
            if (lines.length === 0 && status === 'ok') return;
            banner.classList.remove('hidden');
            banner.className = 'rounded-2xl border px-5 py-4 text-sm shadow-xl ' + (
                status === 'ok'
                    ? 'border-emerald-500/30 bg-emerald-500/10 text-emerald-100'
                    : 'border-amber-500/30 bg-amber-500/10 text-amber-100'
            );
            banner.innerHTML = `<div class="font-semibold">${status === 'ok' ? '正常发布' : '降级发布'}</div><div class="mt-2 leading-7">${lines.join('<br>')}</div>`;
        }

        function renderMissing(meta, dashboard) {
            const hasMissing = (meta.missing_modules && meta.missing_modules.length) || (dashboard.missing_items && dashboard.missing_items.length);
            if (!hasMissing) return;
            $('missing-panel').classList.remove('hidden');
            appendChips('missing-modules', meta.missing_modules || [], '暂无');
            const list = $('missing-items');
            list.innerHTML = '';
            (dashboard.missing_items || []).forEach(item => {
                const li = document.createElement('li');
                li.className = 'rounded-2xl border border-white/5 bg-white/5 px-4 py-3';
                li.textContent = item.reason ? `${item.label}: ${item.reason}` : item.label;
                list.appendChild(li);
            });
            if (!dashboard.missing_items || dashboard.missing_items.length === 0) {
                const li = document.createElement('li');
                li.className = 'text-sm text-slate-500 italic';
                li.textContent = '暂无缺失明细';
                list.appendChild(li);
            }
        }

        function render() {
            const meta = DASHBOARD_DATA.meta || {};
            const dashboard = DASHBOARD_DATA.dashboard || {};

            $('page-title').textContent = dashboard.title || '每日市场看板';
            $('page-subtitle').textContent = dashboard.subtitle || '';
            $('meta-run-date').textContent = meta.run_date || '-';
            $('meta-generated-at').textContent = meta.generated_at || '-';
            $('market-regime').textContent = dashboard.market_regime || 'mixed';
            $('market-summary').textContent = dashboard.summary || '暂无摘要';

            renderBanner(meta);
            renderModuleCards(dashboard.module_cards || []);
            renderSections(dashboard.sections || []);
            appendList('key-points', dashboard.key_points || [], '暂无关键驱动');
            appendList('risks', dashboard.risks || [], '暂无风险提示');
            appendList('watch-items', dashboard.watch_items || [], '暂无观察点');
            appendList('limitations', dashboard.limitations || [], '暂无限制说明');
            appendList('signals', dashboard.signals || [], '暂无异常信号');
            appendChips('sources', dashboard.sources || [], '暂无数据源');
            renderMissing(meta, dashboard);
        }

        render();
    </script>
</body>
</html>
