<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全球金融体系·汇率传导 全景研究体系</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f4f7ff;
      color: #1a3a6e;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(24,85,204,0.05);
      border: 1px solid #d0deea;
    }
    .header h1 { color: #1855cc; letter-spacing: 2px; margin-bottom: 8px; font-size: 1.8rem; }
    .header p { color: #5577aa; font-size: 1rem; }

    .canvas-container {
      width: 100%;
      overflow-x: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(24,85,204,0.08);
      border: 1px solid #d0deea;
      padding: 20px;
    }

    svg {
      display: block;
      min-width: 1650px;
      min-height: 1250px;
      background: #fff;
    }

    .text-blue { fill: #1855cc; font-weight: 700; font-size: 18px; text-anchor: middle; }
    .line-blue { stroke: #1855cc; stroke-width: 2.5; fill: none; }
    .line-axis { stroke: #333; stroke-width: 2; fill: none; }
    .line-graph { stroke: #1855cc; stroke-width: 2.5; fill: none; }
    .label-axis { fill: #333; font-size: 14px; font-weight: 600; }
    .label-region { fill: #1855cc; font-size: 16px; font-weight: 700; }

    .text-block {
      font-size: 14px;
      line-height: 1.7;
      color: #1a3a6e;
      padding: 16px;
      background: #f8faff;
      border: 1px solid #c8d8f0;
      border-radius: 8px;
      height: 100%;
    }
    .text-block.no-bg {
      background: transparent;
      border: none;
      padding: 0;
    }
    .title-main { font-size: 18px; font-weight: 700; color: #1855cc; margin-bottom: 12px; border-bottom: 2px solid #c8d8f0; padding-bottom: 6px; }
    .hl-red { color: #cc2222; font-weight: 700; }
    .hl-green { color: #1a7a4a; font-weight: 700; }

    .var-grid { display: grid; grid-template-columns: 120px 1fr; gap: 8px; margin-bottom: 20px; font-size: 14px; }
    .var-grid .v-name { font-weight: 700; color: #1855cc; }

    .mech-list { display: flex; flex-direction: column; gap: 10px; }
    .mech-item { background: #fff; border: 1px solid #d0deea; padding: 8px 12px; border-radius: 6px; }
    .formula { display: inline-block; font-family: monospace; font-size: 15px; font-weight: 700; color: #1855cc; background: #eef4ff; padding: 2px 6px; border-radius: 4px; margin-right: 8px; }
    .desc { color: #333; font-weight: 600; }

    .footer-text { font-size: 16px; font-weight: 700; color: #1855cc; line-height: 2; border-left: 4px solid #1855cc; padding-left: 12px; margin-bottom: 10px; }
    .back-button {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1855cc;
      color: #fff;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(24,85,204,0.24);
      font-size: 22px;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>全球金融体系 · 汇率传导 研究体系</h1>
  <p>实体经济与金融体系的交织：核心变量、传导机制与内外部均衡</p>
</div>

<div class="canvas-container">
  <svg viewBox="0 0 1650 1250">
    <defs>
      <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#1855cc"/>
      </marker>
      <marker id="arrAxis" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#333"/>
      </marker>
    </defs>

    <foreignObject x="40" y="40" width="550" height="1150">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-block">
        <div class="title-main">全球经济·金融核心变量及传导 《金融炼金术》</div>
        <div class="var-grid">
          <div class="v-name">贸易政策 T</div><div>(<span class="hl-red">↑T</span> 表示贸易顺差，<span class="hl-green">↓T</span> 表示贸易逆差)</div>
          <div class="v-name">财政政策 B</div><div>(<span class="hl-red">↑B</span> 表示财政盈余，<span class="hl-green">↓B</span> 表示财政赤字)</div>
          <div class="v-name">资本流动 S</div><div>(<span class="hl-red">↑S</span> 表示资本流出，<span class="hl-green">↓S</span> 表示资本流入)</div>
          <div class="v-name">长期资本 N</div><div>(<span class="hl-red">↑N</span> 表示长期资本流出，<span class="hl-green">↓N</span> 表示长期资本流入)</div>
          <div class="v-name">货币政策 i</div><div>(<span class="hl-red">↑i</span> 表示利率上升，<span class="hl-green">↓i</span> 表示利率下降)</div>
          <div class="v-name">汇率政策 e</div><div>(<span class="hl-red">↑e</span> 表示本币升值，<span class="hl-green">↓e</span> 表示本币贬值)</div>
          <div class="v-name">经济景气 v</div><div>(<span class="hl-red">↑v</span> 表示经济景气，<span class="hl-green">↓v</span> 表示经济疲弱)</div>
          <div class="v-name">资产价格 P</div><div>(<span class="hl-red">↑P</span> 表示价格上升，<span class="hl-green">↓P</span> 表示价格下降)</div>
        </div>

        <div class="title-main" style="margin-top: 30px;">传导机制</div>
        <div class="mech-list">
          <div class="mech-item">
            <span class="formula">↑e → ↓T</span> <span class="formula">↓e → ↑T</span>
            <span class="desc">汇率升值，抑制出口</span>
          </div>
          <div class="mech-item">
            <span class="formula">↑e → ↓S</span> <span class="formula">↓e → ↑S</span>
            <span class="desc">汇率升值，资本流入</span>
          </div>
          <div class="mech-item">
            <span class="formula">↑i → ↓S</span> <span class="formula">↓i → ↑S</span>
            <span class="desc">利率上升，资本流入</span>
          </div>
          <div class="mech-item">
            <span class="formula">(↑T + ↓N + ↓S) → ↑e</span>
            <div class="desc" style="margin-top:4px;">贸易顺差，资本流入 → 汇率升值</div>
          </div>
          <div class="mech-item">
            <span class="formula">(↓T + ↑N + ↑S) → ↓e</span>
            <div class="desc" style="margin-top:4px;">贸易逆差，资本流出 → 汇率贬值</div>
          </div>
          <div style="color:#b85c00; font-weight:700; margin: 8px 0;">
            * 资本流动是决定短期汇率的核心，由利差和汇率预期驱动套息交易 (Carry Trade)。汇率影响远大于利率。
          </div>
          <div class="mech-item">
            <span class="formula">(↑e + ↑i) → ↓S</span><br>
            <span class="formula" style="margin-top:6px;">(↑e + ↑i) → (↓S > ↓T) → ↑e → (↓S > ↓T)</span>
          </div>
          <div class="mech-item">
            <span class="formula">↑e → ↓S → ↑e → ↓S</span>
            <span class="desc">本币升值和资本流入的自循环加强</span>
          </div>
          <div class="mech-item" style="border-color:#1855cc; background:#f0f5ff;">
            <div style="font-weight:700; color:#1855cc; margin-bottom:6px;">资产价格传导的反身性 A → B → A 即 A ⇌ B</div>
            <ul style="padding-left: 20px; color:#333; margin:0;">
              <li>在自由浮动的汇率机制下，反身性是市场普遍现象（汇率超调、资产价格超调）</li>
              <li>趋势一旦建立会自我加强、自我循环，直到转折点临近（预期被证伪）</li>
            </ul>
          </div>
          <div class="mech-item">
            <div style="font-weight:700; color:#cc2222; margin-bottom:6px;">传导的逆转：</div>
            <span class="formula">当 (↓T + ↑N) > ↓S → ↓e → (↑S + ↓T + ↑N) → ↓e</span><br>
            <span class="formula" style="margin-top:6px;">↓B + ↓T → ↓e → ↑S → ↓e</span>
            <div class="desc" style="margin-top:4px;">转折一旦开始可能转为加强为“自由落体”式的传导</div>
          </div>
          <div style="color:#1a3a6e; font-weight:700; margin-top: 8px;">
            * 由短期资本流动 (Carry Trade) 导致的市场反身性，使市场具有了内在不稳定性。
          </div>
        </div>
      </div>
    </foreignObject>

    <text x="1080" y="60" class="text-blue" style="font-size:22px;">内外部均衡与政策选择</text>

    <g transform="translate(680, 100)">
      <text x="100" y="0" class="text-blue" style="font-size:18px;">蒙代尔法则</text>
      <line x1="20" y1="220" x2="320" y2="220" class="line-axis" marker-end="url(#arrAxis)"/>
      <line x1="40" y1="240" x2="40" y2="-20" class="line-axis" marker-end="url(#arrAxis)"/>
      <text x="300" y="245" class="label-axis">财政政策</text>
      <text x="300" y="265" class="label-axis" style="fill:#1855cc;">扩张</text>
      <text x="40" y="245" class="label-axis" text-anchor="end">紧缩</text>
      <text x="20" y="-10" class="label-axis" text-anchor="end">货币政策</text>
      <text x="20" y="10" class="label-axis" text-anchor="end" style="fill:#1855cc;">扩张</text>
      <text x="20" y="210" class="label-axis" text-anchor="end">紧缩</text>
      <line x1="80" y1="20" x2="260" y2="200" class="line-graph"/>
      <text x="265" y="195" class="label-axis" style="fill:#1855cc;">内部均衡 IB</text>
      <line x1="60" y1="100" x2="300" y2="160" class="line-graph"/>
      <text x="305" y="155" class="label-axis" style="fill:#1855cc;">外部均衡 EB</text>
      <text x="180" y="125" class="label-axis" style="font-size:16px;">E</text>
      <text x="100" y="80" class="label-region">I</text>
      <text x="220" y="100" class="label-region">II</text>
      <text x="240" y="180" class="label-region">III</text>
      <text x="100" y="180" class="label-region">IV</text>
    </g>

    <foreignObject x="1030" y="100" width="160" height="150">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px; font-weight:700; color:#333; line-height:1.8;">
        <div><span style="color:#1855cc;">I</span> &nbsp; 失业 / 逆差</div>
        <div><span style="color:#1855cc;">II</span> &nbsp; 通胀 / 逆差</div>
        <div><span style="color:#1855cc;">III</span> &nbsp; 通胀 / 顺差</div>
        <div><span style="color:#1855cc;">IV</span> &nbsp; 失业 / 顺差</div>
      </div>
    </foreignObject>

    <g transform="translate(1250, 100)">
      <text x="100" y="0" class="text-blue" style="font-size:18px;">斯旺法则</text>
      <line x1="20" y1="220" x2="320" y2="220" class="line-axis" marker-end="url(#arrAxis)"/>
      <line x1="40" y1="240" x2="40" y2="-20" class="line-axis" marker-end="url(#arrAxis)"/>
      <text x="300" y="245" class="label-axis">国内支出</text>
      <text x="300" y="265" class="label-axis" style="fill:#1855cc;">增加</text>
      <text x="20" y="-10" class="label-axis" text-anchor="end">本币实际汇率</text>
      <text x="20" y="10" class="label-axis" text-anchor="end" style="fill:#1855cc;">贬值</text>
      <text x="20" y="210" class="label-axis" text-anchor="end" style="fill:#1855cc;">升值</text>
      <line x1="80" y1="180" x2="260" y2="40" class="line-graph"/>
      <line x1="80" y1="40" x2="260" y2="180" class="line-graph"/>
      <text x="170" y="105" class="label-axis" style="font-size:16px;">E</text>
      <text x="170" y="160" class="label-region">I</text>
      <text x="230" y="115" class="label-region">II</text>
      <text x="170" y="60" class="label-region">III</text>
      <text x="100" y="115" class="label-region">IV</text>
    </g>

    <text x="650" y="480" class="text-blue" style="font-size:20px;">实体经济层面</text>
    <text x="650" y="820" class="text-blue" style="font-size:20px;">金融体系层面</text>

    <g class="line-blue">
      <line x1="830" y1="550" x2="1010" y2="550" marker-end="url(#arrBlue)"/>
      <line x1="1010" y1="570" x2="830" y2="570" marker-end="url(#arrBlue)"/>
      <line x1="1180" y1="550" x2="1360" y2="550" marker-end="url(#arrBlue)"/>

      <line x1="1360" y1="910" x2="1180" y2="910" marker-end="url(#arrBlue)"/>
      <line x1="1085" y1="610" x2="1085" y2="670" marker-end="url(#arrBlue)"/>
      <line x1="1105" y1="670" x2="1105" y2="610" marker-end="url(#arrBlue)"/>
      <line x1="1085" y1="770" x2="1085" y2="830" marker-end="url(#arrBlue)"/>
      <line x1="1105" y1="830" x2="1105" y2="770" marker-end="url(#arrBlue)"/>
      <line x1="810" y1="605" x2="1030" y2="695" marker-end="url(#arrBlue)"/>
      <line x1="1020" y1="715" x2="800" y2="625" marker-end="url(#arrBlue)"/>
      <line x1="1380" y1="605" x2="1160" y2="695" marker-end="url(#arrBlue)"/>
      <line x1="1170" y1="715" x2="1390" y2="625" marker-end="url(#arrBlue)"/>
      <line x1="810" y1="835" x2="1030" y2="745" marker-end="url(#arrBlue)"/>
      <line x1="1020" y1="725" x2="800" y2="815" marker-end="url(#arrBlue)"/>
      <line x1="1380" y1="835" x2="1160" y2="745" marker-end="url(#arrBlue)"/>
      <line x1="1170" y1="725" x2="1390" y2="815" marker-end="url(#arrBlue)"/>
    </g>

    <foreignObject x="680" y="520" width="140" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;">
        <div style="font-size:18px; font-weight:700; color:#1855cc;">贸易政策 T</div>
        <div style="font-size:13px; color:#5577aa;">(顺差 / 逆差)</div>
        <div style="font-size:13px; color:#5577aa;">(盈余 / 赤字)</div>

    </foreignObject>
    <foreignObject x="1025" y="530" width="140" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;">

    <foreignObject x="1370" y="530" width="140" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;">
        <div style="font-size:18px; font-weight:700; color:#1855cc;">财政政策 B</div>
      </div>
    </foreignObject>
    <foreignObject x="1025" y="690" width="140" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;">
        <div style="font-size:24px; font-weight:700; color:#1855cc; background:#eef4ff; border:2px solid #1855cc; border-radius:12px; padding:8px;">汇率 e</div>

    </foreignObject>
    <foreignObject x="680" y="850" width="140" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;">

        <div style="font-size:13px; color:#5577aa;">(利率 / 信用)</div>
      </div>
    </foreignObject>
    <foreignObject x="1025" y="860" width="140" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;">
        <div style="font-size:18px; font-weight:700; color:#1855cc;">资本流动 S <span style="color:#cc2222;">*</span></div>
      </div>
    </foreignObject>
    <foreignObject x="1370" y="850" width="140" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;">

        <div style="font-size:13px; color:#5577aa;">(金融市场)</div>
      </div>
    </foreignObject>

    <foreignObject x="650" y="960" width="400" height="100">
      <div xmlns="http://www.w3.org/1999/xhtml">
        <div style="font-family:monospace; font-size:18px; font-weight:700; color:#1855cc; margin-bottom:8px;">
          i = r + α(π - π*) + β(y - y*)

      </div>

</div>
