<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大类资产框架·全景研究体系</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f4f7ff;
      color: #1a3a6e;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(24,85,204,0.05);
      border: 1px solid #d0deea;
    }
    .header h1 { color: #1855cc; letter-spacing: 2px; margin-bottom: 8px; font-size: 1.8rem; }
    .header p { color: #5577aa; font-size: 1rem; }

    .canvas-container {
      width: 100%;
      overflow-x: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(24,85,204,0.08);
      border: 1px solid #d0deea;
      padding: 20px;
    }

    svg {
      display: block;
      min-width: 1650px;
      min-height: 1250px;
      background: #fff;
    }

    .node-blue { fill: #eef4ff; stroke: #1855cc; stroke-width: 2.5; rx: 8; }
    .text-blue { fill: #1855cc; font-weight: 700; font-size: 18px; text-anchor: middle; }
    .line-blue { stroke: #1855cc; stroke-width: 2.5; fill: none; }
    .line-black-dash { stroke: #333; stroke-width: 2; stroke-dasharray: 6,4; fill: none; }
    .label-text-blue { fill: #1855cc; font-size: 14px; font-weight: 600; }
    .label-text-black { fill: #333; font-size: 14px; font-weight: 600; }
    .label-vert { writing-mode: vertical-rl; letter-spacing: 2px; }

    .text-block {
      font-size: 14px;
      line-height: 1.7;
      color: #1a3a6e;
      padding: 16px;
      background: #f8faff;
      border: 1px solid #c8d8f0;
      border-radius: 8px;
      height: 100%;
    }
    .text-block.no-bg {
      background: transparent;
      border: none;
      padding: 0;
    }
    .title-main { font-size: 18px; font-weight: 700; color: #1855cc; margin-bottom: 8px; }
    .title-sub { font-size: 15px; font-weight: 700; color: #1855cc; border-bottom: 1px solid #c8d8f0; padding-bottom: 4px; margin-bottom: 8px; }

    .hl { color: #1855cc; font-weight: 700; }
    .hl-dark { color: #333; font-weight: 700; }

    ul, ol { padding-left: 20px; margin: 4px 0; }
    li { margin-bottom: 6px; }

    .formula-box {
      background: #fff;
      border: 1px dashed #1855cc;
      padding: 8px 12px;
      border-radius: 6px;
      color: #1855cc;
      font-weight: 700;
      font-family: monospace;
      font-size: 13px;
      margin-top: 8px;
      display: inline-block;
    }

    .cycle-tag {
      display: inline-block;
      background: #333;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .back-button {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1855cc;
      color: #fff;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(24,85,204,0.24);
      font-size: 22px;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>大类资产框架 · 全景研究体系</h1>
  <p>严格还原原图拓扑结构：蓝色代表资产传导，黑色代表周期与宏观因子映射</p>
</div>

<div class="canvas-container">
  <svg viewBox="0 0 1650 1250">
    <defs>
      <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#1855cc"/>
      </marker>
      <marker id="arrBlueRev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
        <polygon points="8 0,0 3,8 6" fill="#1855cc"/>
      </marker>
      <marker id="arrBlack" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#333"/>
      </marker>
    </defs>

    <foreignObject x="40" y="40" width="450" height="200">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-block no-bg">
        <div class="title-main">大类资产框架 &nbsp;&nbsp; 研究体系</div>
        <div><b>底层大类资产：</b>债券(利率) + 原油</div>
        <div><b>分层大类资产：</b>外汇(汇率) + 股票(权益) + 商品</div>
        <div><b>大类资产传导：</b>利率传导 + 汇率传导 + 波动率传导</div>
      </div>
    </foreignObject>

    <foreignObject x="440" y="160" width="300" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-block no-bg" style="text-align:center;">
        <div style="font-weight:700; color:#1855cc; font-size:16px;">消费国 — 生产国 — 资源国</div>
        <div style="color:#333; font-weight:700; margin-top:6px; font-size:15px;">热力图、全景图</div>
      </div>
    </foreignObject>

    <foreignObject x="900" y="40" width="700" height="200">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-block no-bg" style="font-size:14px;">
        <div class="title-main">大类资产跟踪 <span style="font-size:14px; color:#5577aa; font-weight:normal;">(发达市场DM · 新兴市场EM)</span></div>
        <div><span class="hl">债券：</span>美国、欧洲、日本、中国、澳洲</div>
        <div><span class="hl">股票：</span>美国、欧洲、日本、中国、香港</div>
        <div><span class="hl">汇率：</span>美元、欧元、英镑、日元 &nbsp;|&nbsp; <span style="color:#b85c00">[商品货币]</span> 澳元、加元、新西兰元</div>
        <div><span class="hl">商品：</span>
          有色 (铜、锌、铝) &nbsp;|&nbsp;
          黑色 (螺纹、铁矿石、焦煤、焦炭) &nbsp;|&nbsp;
          贵金属 (金、银、铂、钯) &nbsp;|&nbsp;
          原油 (WTI, Brent, Dubai, SC, Oman)
        </div>
        <div style="margin-top:8px; color:#1855cc; font-weight:700;">
          PPI (黑色、有色、农产品、原油、化工)
        </div>
      </div>
    </foreignObject>

    <line x1="560" y1="300" x2="740" y2="300" class="line-blue"/>
    <line x1="860" y1="300" x2="1040" y2="300" class="line-blue"/>
    <line x1="740" y1="800" x2="560" y2="800" class="line-blue" marker-end="url(#arrBlue)"/>
    <line x1="860" y1="800" x2="1040" y2="800" class="line-blue"/>
    <line x1="560" y1="550" x2="740" y2="550" class="line-blue" marker-start="url(#arrBlueRev)" marker-end="url(#arrBlue)"/>
    <line x1="1040" y1="550" x2="860" y2="550" class="line-blue" marker-end="url(#arrBlue)"/>
    <line x1="780" y1="330" x2="795" y2="520" class="line-blue" marker-end="url(#arrBlue)"/>
    <line x1="800" y1="580" x2="800" y2="770" class="line-blue" marker-end="url(#arrBlue)"/>
    <line x1="1100" y1="330" x2="1100" y2="520" class="line-blue"/>
    <line x1="1100" y1="580" x2="1100" y2="770" class="line-blue"/>

    <line x1="500" y1="330" x2="500" y2="520" class="line-black-dash" marker-end="url(#arrBlack)"/>
    <line x1="500" y1="770" x2="500" y2="580" class="line-black-dash" marker-end="url(#arrBlack)"/>
    <line x1="300" y1="620" x2="450" y2="620" class="line-black-dash"/>
    <line x1="550" y1="620" x2="750" y2="620" class="line-black-dash"/>

    <text x="480" y="430" class="label-text-black label-vert">增长之差</text>
    <text x="480" y="680" class="label-text-black label-vert">通胀之差</text>
    <text x="770" y="430" class="label-text-blue label-vert">油铜比</text>
    <text x="650" y="535" class="label-text-blue" text-anchor="middle">利率之差</text>
    <text x="650" y="575" class="label-text-blue" text-anchor="middle">资本流动</text>
    <text x="950" y="535" class="label-text-blue" text-anchor="middle">信用(M1·M2·社融)</text>
    <text x="950" y="575" class="label-text-blue" text-anchor="middle">货币(基准利率)</text>
    <text x="950" y="785" class="label-text-blue" text-anchor="middle">油金比</text>
    <text x="950" y="820" class="label-text-blue" text-anchor="middle">铜金比 &nbsp; 金银比</text>

    <rect x="440" y="270" width="120" height="60" class="node-blue"/>
    <text x="500" y="307" class="text-blue">增长</text>
    <rect x="740" y="270" width="120" height="60" class="node-blue"/>
    <text x="800" y="307" class="text-blue">商 品</text>
    <rect x="1040" y="270" width="120" height="60" class="node-blue"/>
    <text x="1100" y="307" class="text-blue">股票 Stock</text>

    <rect x="440" y="520" width="120" height="60" class="node-blue"/>
    <text x="500" y="557" class="text-blue">e 汇率</text>
    <rect x="740" y="520" width="120" height="60" class="node-blue"/>
    <text x="800" y="548" class="text-blue">利率 i</text>
    <text x="800" y="570" class="label-text-black" text-anchor="middle" style="font-size:12px;">(央行货币政策MP)</text>
    <rect x="1040" y="520" width="120" height="60" class="node-blue"/>
    <text x="1100" y="557" class="text-blue">债券 Bond</text>

    <rect x="440" y="770" width="120" height="60" class="node-blue"/>
    <text x="500" y="807" class="text-blue">通胀 CPI</text>
    <rect x="740" y="770" width="120" height="60" class="node-blue"/>
    <text x="800" y="807" class="text-blue">原 油</text>
    <rect x="1040" y="770" width="120" height="60" class="node-blue" style="fill:#fffbee; stroke:#c8a000;"/>
    <text x="1100" y="807" class="text-blue" style="fill:#8a6800;">黄金 Gold</text>

    <text x="500" y="255" class="hl-dark" text-anchor="middle" style="font-size:16px;">[经济周期]</text>
    <text x="1100" y="255" class="hl-dark" text-anchor="middle" style="font-size:16px;">[估值周期]</text>
    <text x="500" y="615" class="hl-dark" text-anchor="middle" style="font-size:16px;">[汇率周期]</text>
    <text x="800" y="615" class="hl-dark" text-anchor="middle" style="font-size:16px;">[利率周期]</text>
    <text x="500" y="855" class="hl-dark" text-anchor="middle" style="font-size:16px;">[通胀周期]</text>

    <foreignObject x="40" y="270" width="350" height="220">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-block">
        <div class="title-sub">跟踪指标映射</div>
        <div>美债长短利差(10y-2y) &nbsp;→&nbsp; <span class="hl">增长</span></div>
        <div>日元/澳元, 日元/纽元 &nbsp;→&nbsp; <span class="hl-dark">增长之差</span></div>
        <div>VIX, 标普, 纳指 &nbsp;→&nbsp; <span class="hl-dark">[波动率周期]</span></div>
        <div>油铜比 &nbsp;→&nbsp; <span class="hl">商品->利率传导</span></div>
        <div>离岸人民币(USD CNH) &nbsp;→&nbsp; <span class="hl">汇率</span></div>
      </div>
    </foreignObject>

    <foreignObject x="40" y="550" width="250" height="200">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-block" style="border-color:#444; background:#f8f9fa;">
        <div class="cycle-tag">[波动率周期]</div>
        <ul>
          <li>债券波动率</li>
          <li>原油波动率</li>
          <li>汇率波动率</li>
          <li>权益波动率 (VIX)</li>
        </ul>
      </div>
    </foreignObject>

    <foreignObject x="440" y="870" width="120" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-block no-bg" style="text-align:center; color:#1855cc; font-weight:700;">
        <div>(猪周期)</div>
        <div>(油周期)</div>
      </div>
    </foreignObject>

    <foreignObject x="1180" y="200" width="420" height="300">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-block">
        <div class="title-sub">股票 Stock 定价要素</div>
        <ol>
          <li><b>OCF 现金流</b> (FCF = DCF - CAPEX 资产负债表观)</li>
          <li><b>g 内生成长性</b></li>
          <li><b>rf 无风险收益率</b> ← 国债到期收益率</li>
          <li><b>Rp 风险溢价</b> —— M2 - GDP</li>
          <li><b>监管</b></li>
        </ol>
        <div class="formula-box">
          ERP = re - rf = 1/PE - rf<br>
          EYBY = EY/BY = 1 / (BY * PE)
        </div>
      </div>
    </foreignObject>

    <foreignObject x="1180" y="520" width="420" height="300">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-block">
        <div class="title-sub">债券 Bond 分析框架</div>
        <div><b>A. 投资收益构成：</b>票息 + 资本利得 + 杠杆套息</div>
        <div><b>B. 收益率曲线水平与形态：</b>期限结构、信用利差</div>
        <div style="margin-top:8px;"><b>C. 债券市场驱动因素：</b></div>
        <ol>
          <li>经济基本面 (融资需求 vs. 资金供给)</li>
          <li>资金面 (流动性分析)</li>
          <li>政策面 (货币政策、监管政策)</li>
          <li>供需关系</li>
          <li>市场情绪</li>
        </ol>
      </div>
    </foreignObject>

    <foreignObject x="650" y="850" width="450" height="320">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-block">
        <div class="title-sub">原油 三层分析框架</div>
        <div><b>宏观：</b>供给 vs. 需求</div>
        <div><b>中观：</b>库存 · 商品属性</div>
        <div><b>微观：</b>价差 · 结构 · 金融属性</div>
        <ol style="margin-top:8px;">
          <li><b>跨区价差：反映平衡</b><br>
              <span style="color:#5577aa">东西价差 Brent - Dubai &nbsp;|&nbsp; 跨洋价差 WTI - Brent</span>
          </li>
          <li><b>裂解价差：反映需求</b></li>
          <li><b>期限价差：反映库存</b><br>
              <span style="color:#b85c00">Contango / 近低远高</span> - 供大于求 - 正向套利 - 累库存<br>
              <span style="color:#1a7a4a">Backwardation / 近高远低</span> - 供不应求 - 反向套利 - 去库存
          </li>
        </ol>
      </div>
    </foreignObject>

    <foreignObject x="1180" y="830" width="450" height="320">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-block" style="border-color:#c8a000; background:#fffbee;">
        <div class="title-sub" style="color:#8a6800; border-color:#e8d080;">黄金 Gold 定价逻辑</div>
        <div style="font-weight:700; font-size:16px; color:#1855cc; margin-top:12px;">
          实体综合投资回报率 &nbsp;<span style="color:#8a6800; font-style:italic;">VS</span>&nbsp; 实际利率
        </div>
        <div style="margin-left: 20px; margin-top: 12px; border-left: 2px solid #1855cc; padding-left: 12px; line-height: 2;">
          <div style="font-weight:700; color:#1855cc;">实际利率拆解：</div>
          <div><span style="color:#8a6800; font-weight:bold;">① 名义利率</span> — 国债收益率 ← 美联储基准利率(OIS)</div>
          <div><span style="color:#8a6800; font-weight:bold;">② 物价水平</span> — 通胀预期</div>
        </div>
        <div style="margin-top: 16px; font-weight: 700; color: #1855cc; display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 20px;">↑</span> <span>锚定指标：</span>
        </div>
        <div style="background: #fff; border: 1px dashed #1855cc; padding: 10px 12px; border-radius: 6px; color: #1855cc; font-weight: 700; font-size: 14px; margin-top: 6px; line-height: 1.6;">
          TIPS通胀保值债券收益率 <span style="font-size: 12px; color: #5577aa; font-weight: normal;">(反映美实际利率水平)</span><br>
          = 美债名义利率 - 通胀水平
        </div>
      </div>
    </foreignObject>
  </svg>
</div>

<a href="../index.html" class="back-button" aria-label="Back">←</a>

</body>
</html>
